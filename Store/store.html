<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - NextBit</title>
    <link rel="icon" type="image/png" sizes="500x500" href="../Logo/logo.png">

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="store.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR PLACEHOLDER (injected by nav.js) -->
    <div id="nav-placeholder"></div>

    <main class="learn-container">

        <section class="learn-header animate-on-scroll">
            <span class="section-tag">NextBit Digital Store</span>
            <h1 class="learn-title">Tools & Software Apps</h1>
            <p class="learn-subtitle">
                Pay once, own forever. Download collection of templates, automation scripts, and server tools directly
                to your device.
            </p>
        </section>

        <!-- Category Filters (built dynamically from GET /api/products) -->
        <section class="filter-section animate-on-scroll">
            <div class="filter-container" id="filterContainer"></div>

            <input type="text" id="cardSearchInput" class="store-search-input"
                placeholder="Search products...">
        </section>

        <!-- Product Grid (rendered from GET /api/products) -->
        <section class="learn-grid-section">
            <div class="learn-grid" id="storeGrid"></div>
        </section>

    </main>

    <!-- Shopping Cart Modal Overlay -->
    <div class="cart-modal-overlay" id="cartModal">
        <div class="cart-drawer">
            <div class="cart-drawer-header">
                <div class="cart-drawer-title">
                    <img src="../Icon/cart.svg" alt="Cart" class="cart-icon">
                    <h2>Cart (<span id="cartDrawerCount">0</span>)</h2>
                </div>
                <button class="cart-close-btn" id="closeCartBtn">&times;</button>
            </div>

            <div class="cart-items-body" id="cartItemsContainer">
                <p class="cart-empty-text">Your cart is empty.</p>
            </div>

            <div class="cart-drawer-footer">
                <div class="order-summary">
                    <div class="summary-row">
                        <span>Total Items</span>
                        <span id="summaryItemCount">0</span>
                    </div>
                    <div class="summary-row grand-total">
                        <span>Grand Total</span>
                        <span id="summaryGrandTotal">Rp 0</span>
                    </div>
                </div>

                <div class="checkout-email-group">
                    <input type="text" id="customerName" placeholder="Your full name" autocomplete="name" required>
                </div>

                <div class="checkout-email-group">
                    <input type="email" id="customerEmail" placeholder="Enter your email address" autocomplete="email" required>
                </div>

                <button class="checkout-btn" onclick="checkoutWithMidtrans()">Buy Now</button>
                <button class="continue-btn" id="continueShoppingBtn">Continue Shopping</button>
            </div>
        </div>
    </div>

    <!-- FOOTER SECTION -->
    <div id="footer-placeholder"></div>
    <script src="../nav.js" defer></script>
    <script src="../footer.js" defer></script>
    <script src="../anim.js" defer></script>

    <script>
        // ============================================================
        // PRODUCTS LOADED FROM THE BACKEND (GET /api/products)
        // The catalog on the server is the single source of truth.
        // ============================================================
        let products = {}; // id -> product
        let cart = JSON.parse(localStorage.getItem("nextbit_cart")) || [];

        async function loadProducts() {
            const grid = document.getElementById("storeGrid");
            grid.innerHTML = `<p class="store-loading">Loading products...</p>`;

            try {
                const res = await fetch('/api/products');
                const data = await res.json();

                if (!res.ok || !Array.isArray(data.products)) {
                    throw new Error('Failed to load products.');
                }

                products = {};
                data.products.forEach(p => { products[p.id] = p; });

                renderProducts();
                buildFilterButtons();
            } catch (err) {
                console.error('Failed to load products:', err);
                grid.innerHTML =
                    `<p class="store-loading">Could not load products. Make sure the backend is running.</p>`;
            }
        }

        function renderProducts() {
            const grid = document.getElementById("storeGrid");
            grid.innerHTML = '';

            Object.values(products).forEach(product => {
                const categorySlug = String(product.category || '').toLowerCase();

                const actions = product.available
                    ? `
                        <div class="product-actions">
                            <button class="add-cart-btn" onclick="addToCart('${product.id}')">
                                <img src="/Icon/cart.svg" alt="Add to cart" class="cart-icon">
                            </button>
                            <button class="buy-now-btn" onclick="buyNow('${product.id}')">Buy Now</button>
                        </div>
                    `
                    : `<p class="product-unavailable">Currently unavailable</p>`;

                const card = document.createElement('article');
                card.className = 'card card--dark product-card animate-on-scroll is-visible';
                card.dataset.category = categorySlug;
                card.dataset.id = product.id;

                card.innerHTML = `
                    <a href="${product.detailPath || '#'}" class="product-card-link">
                        <div class="card-img-wrapper store-img-wrapper">
                            <img src="${product.image}" alt="${product.title}" class="card-img">
                        </div>
                        <div class="card-content">
                            <div class="card-meta">
                                <span class="card-category">${product.category}</span>
                                <span class="product-price">${product.formattedPrice}</span>
                            </div>
                            <h3 class="card-title store-card-title">${product.title}</h3>
                            <p class="card-desc">${product.description || ''}</p>
                        </div>
                    </a>
                    <div class="product-card-footer">
                        ${actions}
                    </div>
                `;

                grid.appendChild(card);
            });

            filterAndSearchProducts();
        }

        // Filter buttons are built from the actual categories in the
        // catalog, so they can never point to an empty/nonexistent value.
        function buildFilterButtons() {
            const container = document.getElementById("filterContainer");
            container.innerHTML = '';

            const categories = [...new Set(
                Object.values(products)
                    .filter(p => p.available)
                    .map(p => String(p.category || '').toLowerCase())
                    .filter(Boolean)
            )];

            const filters = ['all', ...categories];

            filters.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (index === 0 ? ' active' : '');
                btn.dataset.filter = cat;
                btn.innerHTML = `
                    <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>${cat === 'all' ? 'All Products' : productCategoryLabel(cat)}</span>
                `;
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterAndSearchProducts();
                });
                container.appendChild(btn);
            });
        }

        function productCategoryLabel(slug) {
            const found = Object.values(products).find(
                p => String(p.category || '').toLowerCase() === slug
            );
            return found ? found.category : slug;
        }

        // ============================================================
        // CART (browser-side, informational only)
        // The checkout amount is always recomputed server-side.
        // ============================================================

        function saveCart() {
            localStorage.setItem("nextbit_cart", JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const totalQuantity = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById("cartCount").textContent = totalQuantity;
            document.getElementById("cartDrawerCount").textContent = totalQuantity;
            document.getElementById("summaryItemCount").textContent = totalQuantity;

            const container = document.getElementById("cartItemsContainer");
            if (cart.length === 0) {
                container.innerHTML = `<p class="cart-empty-text">Your cart is empty.</p>`;
                document.getElementById("summaryGrandTotal").textContent = "Rp 0";
                return;
            }

            let html = "";

            cart.forEach((item, index) => {
                const catalog = products[item.id];
                const title = catalog ? catalog.title : item.title;
                const price = catalog ? catalog.price : (item.price || 0);

                html += `
                    <div class="cart-item">
                        <img src="${catalog ? catalog.image : item.image}" alt="${title}" class="cart-item-img">
                        <div class="cart-item-info">
                            <h4>${title}</h4>
                            <p class="cart-item-price">${catalog ? catalog.formattedPrice : 'Rp ' + price.toLocaleString("id-ID")}</p>
                            <span class="cart-item-qty">Qty: ${item.qty}</span>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart(${index})">&times;</button>
                    </div>
                `;
            });

            container.innerHTML = html;

            const grandTotalLine = cart
                .filter(item => products[item.id])
                .reduce((sum, item) => sum + products[item.id].price * item.qty, 0);

            document.getElementById("summaryGrandTotal").textContent =
                grandTotalLine > 0 ? `Rp ${grandTotalLine.toLocaleString("id-ID")}` : "Rp 0";
        }

        function addToCart(id) {
            const product = products[id];
            if (!product) return alert("Product not found.");

            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, qty: 1 });
            }
            saveCart();
            animateCartIcon();
        }

        function buyNow(id) {
            addToCart(id);
            openCartModal();
        }

        function animateCartIcon() {
            const navCartBtn = document.getElementById("openCartBtn");
            if (navCartBtn) {
                navCartBtn.classList.add("cart-bounce");
                setTimeout(() => navCartBtn.classList.remove("cart-bounce"), 400);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function openCartModal() {
            document.getElementById("cartModal").classList.add("active");
        }

        function closeCartModal() {
            document.getElementById("cartModal").classList.remove("active");
        }

        // ============================================================
        // CHECKOUT — Midtrans Snap
        // The browser only sends { productId, customer }. The server
        // validates everything and returns a Snap token.
        // ============================================================

        let snapScriptLoaded = false;

        function loadSnapScript(url, clientKey) {
            return new Promise((resolve, reject) => {
                if (window.snap && snapScriptLoaded) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = url;
                script.setAttribute('data-client-key', clientKey);
                script.async = true;
                script.onload = () => {
                    snapScriptLoaded = true;
                    resolve();
                };
                script.onerror = () => reject(new Error('Failed to load payment widget.'));
                document.head.appendChild(script);
            });
        }

        async function checkoutWithMidtrans() {
            const name = document.getElementById("customerName").value.trim();
            const email = document.getElementById("customerEmail").value.trim();

            if (cart.length === 0) return alert("Your cart is empty!");
            if (!name || name.length < 2) return alert("Please enter your full name.");
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert("Please enter a valid email address.");

            const productId = cart[0].id;
            const checkoutBtn = document.querySelector(".checkout-btn");
            checkoutBtn.disabled = true;
            checkoutBtn.textContent = "Processing...";

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, customer: { name, email } })
                });

                let data = {};
                try { data = await res.json(); } catch (_) { /* ignore */ }

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Checkout failed.');
                }

                await loadSnapScript(data.midtrans.snapScriptUrl, data.midtrans.clientKey);

                window.snap.pay(data.token, {
                    onSuccess: (result) => {
                        console.log('Snap onSuccess:', result);
                        cart = [];
                        saveCart();
                        closeCartModal();
                        alert(
                            "Payment submitted. Waiting for payment confirmation...\n\n" +
                            "Once the payment is confirmed, we will email your download link to you."
                        );
                        pollOrderStatus(data.orderId);
                    },
                    onPending: (result) => {
                        alert(
                            "Payment pending. Please complete the payment to continue.\n" +
                            (result.status_message ? `(${result.status_message})` : '')
                        );
                    },
                    onError: (result) => {
                        alert(
                            "Payment error. Your order was not charged.\n" +
                            (result.status_message ? `(${result.status_message})` : '')
                        );
                    },
                    onClose: () => {
                        alert("Payment window closed. Your order has not been paid yet. You can retry anytime.");
                    }
                });

            } catch (err) {
                console.error('Checkout error:', err);
                alert(`❌ ${err.message || "Could not reach the server. Make sure the backend is running."}`);
            } finally {
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = "Buy Now";
            }
        }

        // Lightweight poller so the customer knows when the payment is
        // confirmed and the delivery email has been sent.
        function pollOrderStatus(orderId) {
            let attempts = 0;
            const timer = setInterval(async () => {
                attempts += 1;
                if (attempts > 10) {
                    clearInterval(timer);
                    return;
                }
                try {
                    const res = await fetch(`/api/order/${encodeURIComponent(orderId)}`);
                    const data = await res.json();
                    if (data.paymentStatus === 'paid' && data.fulfillmentStatus === 'fulfilled') {
                        clearInterval(timer);
                        alert("✅ Payment confirmed! Your download link has been emailed to you.");
                    }
                } catch (_) { /* transient failures are ignored */ }
            }, 5000);
        }

        // ============================================================
        // FILTERING & SEARCH
        // ============================================================

        function filterAndSearchProducts() {
            const activeFilterBtn = document.querySelector('.filter-btn.active');
            const activeCategory = activeFilterBtn ? activeFilterBtn.getAttribute('data-filter') : 'all';
            const searchInput = document.getElementById('cardSearchInput');
            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';

            document.querySelectorAll('.product-card').forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                const title = card.querySelector('.store-card-title').textContent.toLowerCase();
                const desc = card.querySelector('.card-desc').textContent.toLowerCase();

                const matchesCategory = (activeCategory === 'all' || cardCategory === activeCategory);
                const matchesSearch = title.includes(searchQuery) || desc.includes(searchQuery);

                card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadProducts();
            updateCartUI();

            if (window.location.hash === '#checkout') {
                openCartModal();
                history.replaceState(null, '', window.location.pathname);
            }

            document.getElementById("openCartBtn").addEventListener("click", openCartModal);
            document.getElementById("closeCartBtn").addEventListener("click", closeCartModal);
            document.getElementById("continueShoppingBtn").addEventListener("click", closeCartModal);

            document.getElementById("cartModal").addEventListener("click", (e) => {
                if (e.target.id === "cartModal") closeCartModal();
            });

            const searchInput = document.getElementById('cardSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', filterAndSearchProducts);
            }
        });
    </script>
</body>

</html>
