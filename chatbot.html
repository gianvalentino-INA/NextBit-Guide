<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextBit AI Assistant</title>
    <link rel="icon" type="image/png" sizes="500x500" href="Logo/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chatbot.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- MARKDOWN PARSER FOR RICH TEXT / BULLET POINTS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="chat-body-page">

    <!-- FLOATING GLASS DOCK HEADER -->
    <!-- NAVBAR PLACEHOLDER (injected by nav.js) -->
    <div id="nav-placeholder"></div>

    <!-- CHATBOT MAIN WRAPPER -->
    <main class="chat-app-wrapper">
        <h1 class="chat-app-title">NextBit AI Assistant</h1>

        <div class="chat-messages" id="chatMessages">
            <div class="message message--bot">
                Hello! I'm the NextBit AI Assistant. Ask me anything about Linux, Networking, SysAdmin, DevOps, or our
                tutorials!
            </div>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" class="chat-input-field" id="chatInput" placeholder="Ask NextBit Assistant..." required
                autocomplete="off">
            <button type="submit" class="chat-send-btn" aria-label="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </form>
    </main>

    <!-- COMPLETE FRONTEND JAVASCRIPT -->
    <script>
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = chatInput.value.trim();
            if (!message) return;

            // 1. Add user message
            appendMessage(message, 'user');
            chatInput.value = '';

            // 2. Add temporary bot thinking state
            const botBubble = appendMessage('Thinking...', 'bot');

            try {
                // 3. Send fetch request to local Node server
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userMessage: message })
                });

                const data = await response.json();

                // 4. Render markdown formatted response & scroll down
                const rawReply = data.reply || "No response received.";
                botBubble.innerHTML = (typeof marked !== 'undefined') ? marked.parse(rawReply) : rawReply;
                scrollToBottom();

            } catch (error) {
                console.error('Connection Error:', error);
                botBubble.textContent = '⚠️ Could not reach server. Make sure "node server.js" is running in PowerShell.';
                scrollToBottom();
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'message--user' : 'message--bot');

            if (sender === 'bot' && text !== 'Thinking...') {
                msgDiv.innerHTML = (typeof marked !== 'undefined') ? marked.parse(text) : text;
            } else {
                msgDiv.textContent = text;
            }

            chatMessages.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>

    <script src="nav.js" defer></script>
</body>

</html>
